<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio7</title>
    <style>
        td,
        table {
            border-style: solid;
            border-width: 3px;
        }

        th {
            background-color: black;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h2>7. CABEÇALHOS DE LINHA</h2>
    <table>
        <caption>Produtos</caption>
        <thead>
            <tr>
                <!-- td trocado para th -->
                <th scope="col">Produto</th>
                <th scope="col">Preço</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td scope="row">Mouse</td>
                <td scope="row">50,00</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
