<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio5</title>
    <style>
        td,
        table {
            border-style: solid;
            border-width: 3px;
        }

        th {
            background-color: black;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h2>5. CABEÇALHOS DE COLUNA</h2>
    <table>
        <thead>
            <th scope="col">Produto</th>
            <th scope="col">Categoria</th>
            <th scope="col">Preço</th>
            <th scope="col">Quantidade</th>
        </thead>
        <tbody>
            <tr>
                <td>Arroz</td>
                <td>Alimentos</td>
                <td>R$ 25,00</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Feijão</td>
                <td>Alimentos</td>
                <td>R$ 8,50</td>
                <td>15</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Leite</td>
                <td>Bebidas</td>
                <td>R$ 5,00</td>
                <td>20</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
