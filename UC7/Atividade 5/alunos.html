<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; object-src'none'; base-uri 'none'">
    <title>Cadastro de alunos</title>
    <link rel="stylesheet" href="style/main.css">
    <script src="cadastro.js" defer></script>
    <script src="renderer.js" defer></script>
</head>

<body>
    <main>
        <header>
            <p class="subtitulo">ELECTRON + MYSQL</p>
            <h1>Cadastro de alunos</h1>
            <div class="acoes navegacao">
                <button id="voltarMenu" type="button" class="secundario">voltar ao menu</button>
                <button id="sair" type="button" class="secundario">sair</button>
            </div>
        </header>

        <form id="formulario">
            <h2 id="tituloFormulario">Novo aluno</h2>

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" maxlength="100" required>

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" maxlength="150" required>

            <label for="telefone">telefone</label>
            <input type="tel" id="telefone" name="telefone" maxlength="20" autocomplete="tel" required>

            <div class="acoes">
                <button id="salvar" type="submit">Cadastrar</button>
                <button id="cancelar" type="button" class="secundario" hidden="hidden">Cancelar edição</button>
            </div>
        </form>
        <p id="mensagem" role="status" aria-live="polite"></p>

        <section aria-labelledby="tituloLista">
            <div id="cabecalhoRelatorio">
                <h2>Relatório de alunos cadastrados</h2>
                <p id="dataRelatorio"></p>
            </div>
            <div class="cabecalhoLista">
                <h2 id="tituloLista">Alunos cadastrados</h2>
                <div class="acoesLista">
                    <button id="recarregar" class="secundario" type="button">Atualizar lista</button>
                    <button id="imprimirRelatorio" type="button">gerar relatório</button>
                </div>
            </div>

            <table>
                <caption id="resumo">Carregando registro...</caption>
                <thead>
                    <tr>
                        <th scope="col">Código</th>
                        <th scope="col">Nome</th>
                        <th scope="col">E-mail</th>
                        <th scope="col">Telefone</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </section>
    </main>
</body>

</html>
