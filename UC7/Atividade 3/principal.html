<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="content-Security-Policy"
        content="default-src 'self'; script-src 'self'; 'syle-src 'self' object-src 'none'; base-uri 'none">
    <title>Tela principal</title>
    <link rel="stylesheet" href="style/main.css">
    <script src="principal.js" defer></script>
</head>

<body>
    <main>
        <header>
            <p class="subtitulo">ELECTRON + MYSQL</p>
            <h1>Sistema acadêmico</h1>

        </header>

        <nav class="gradeMenu" aria-label="Cadastros">

            <button type="button" data-cadastro="matriculas">Cadastro de matrículas</button>

        <button type="button" id="sair" class="secundario">sair</button>

</html>
