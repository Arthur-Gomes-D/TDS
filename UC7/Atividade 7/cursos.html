<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none';"
    >
    <title>Cadastro de Cursos</title>
    <link rel="stylesheet" href="style/main.css">
    <script src="cadastro.js" defer></script>
    <script src="cursos.js" defer></script>
</head>

<body>
    <main>
        <header>
            <p class="subtitulo">ELECTRON + MYSQL</p>
            <h1>Cadastro de Cursos</h1>
            <div class="acoes navegacao">
                <button id="voltarMenu" type="button" class="secundario">Voltar ao Menu</button>
                <button id="sair" type="button" class="secundario">Sair</button>
            </div>
        </header>
        <form id="formulario">
            <h2 id="tituloFormulario">Novo Curso</h2>

            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required>

            <label for="cargaHoraria">Carga Horária</label>
            <input id="cargaHoraria" name="cargaHoraria" type="number" min="1" max="10000" step="1" required>
            <label for="descricao">Descrição (opcional)</label>
            <textarea id="descricao" name="descricao" maxlength="200" rows="2" required></textarea>

            <div class="acoes">
                <button id="salvar" type="submit">Salvar</button>
                <button id="cancelar" type="button" class="secundario">Cancelar</button>
            </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <section aria-labelledby="tituloLista">
            <div class="cabecalhoRelatorio">
                <h2>Relatório de Cursos cadastrados</h2>
                <p id="dataRelatorio"></p>
            </div>
            <div class="cabecalhoLista">
                <h2 id="tituloLista">Cursos Cadastrados</h2>
                <div class="acoesLista">
                    <button id="recarregar" type="button" class="secundario">Atualizar Lista</button>
                    <button id="imprimirRelatorio" type="button">Gerar Relatório</button>
                </div>
            </div>

            <table>
                <caption id="resumo">Carregando registros...</caption>
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Carga Horária</th>
                        <th scope="col">Descrição</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </section>
    </main>
</body>

</html>
