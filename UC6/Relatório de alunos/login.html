<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';
object-src 'none'; base-uri 'none'">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>

<body class="paginaLogin">

    <main>
        <header>
            <h1>Acesso ao cadastro</h1>
        </header>
        <form id="formLogin">

            <label for="usuario">Usuário</label>
            <input id="usuario" name="usuario" maxlength="100" autocomplete="username" required autofocus>
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" maxlength="128" autocomplete="current-password" required>
            <div class="acoes">

                <button id="entrar" type="submit">Entrar</button>
            </div>
            <p id="mensagemLogin" role="status" aria-live="polite"></p>
        </form>
    </main>
</body>

</html>
